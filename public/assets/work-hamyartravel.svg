<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg-hamyar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#051D18"/>
      <stop offset="60%" stop-color="#0A3C31"/>
      <stop offset="100%" stop-color="#145A48"/>
    </linearGradient>
    <radialGradient id="glow-hamyar" cx="0.75" cy="0.25" r="0.65">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-hamyar" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bg-hamyar)"/>
  <rect width="1000" height="1000" fill="url(#dots-hamyar)"/>
  <rect width="1000" height="1000" fill="url(#glow-hamyar)"/>

  <!-- Compass Star / Sunburst in background -->
  <g stroke="#34D399" stroke-opacity="0.2" stroke-width="1.5">
    <circle cx="720" cy="360" r="140" fill="none"/>
    <circle cx="720" cy="360" r="80" fill="none"/>
    <line x1="720" y1="200" x2="720" y2="520"/>
    <line x1="560" y1="360" x2="880" y2="360"/>
    <line x1="607" y1="247" x2="833" y2="473"/>
    <line x1="607" y1="473" x2="833" y2="247"/>
  </g>

  <!-- Stylized Mountain & Architecture Silhouette -->
  <g fill="none" stroke="#6EE7B7" stroke-width="3">
    <!-- Mountain Peaks -->
    <path d="M120 660 L320 440 L440 540 L600 380 L760 520 L920 660" stroke-width="4" stroke-linecap="round"/>
    <path d="M320 440 L340 660 M600 380 L620 660" stroke-opacity="0.25" stroke-dasharray="6,6"/>
    <!-- Foreground Hill with Shading -->
    <path d="M80 680 Q 300 590 520 660 T 940 640" stroke="#10B981" stroke-width="5"/>
  </g>

  <!-- Minaret / Dome Architectural Silhouette -->
  <g fill="#A7F3D0" fill-opacity="0.15" stroke="#A7F3D0" stroke-width="2">
    <!-- Minaret -->
    <path d="M220 660 L230 490 Q 235 470 240 450 Q 245 470 250 490 L260 660 Z"/>
    <circle cx="240" cy="445" r="5" fill="#6EE7B7"/>
    <!-- Dome -->
    <path d="M280 660 L280 570 Q 330 510 380 570 L380 660 Z"/>
    <line x1="330" y1="510" x2="330" y2="480" stroke="#6EE7B7" stroke-width="3"/>
    <circle cx="330" cy="475" r="4" fill="#6EE7B7"/>
  </g>

  <!-- Dynamic Curved Travel Route with GPS Pins -->
  <path d="M140 620 Q 340 320 540 480 T 880 340" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" stroke-dasharray="10,12"/>
  <g fill="#FBBF24">
    <circle cx="140" cy="620" r="10"/>
    <circle cx="540" cy="480" r="9"/>
    <circle cx="880" cy="340" r="12"/>
    <circle cx="880" cy="340" r="22" fill="none" stroke="#FBBF24" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="70" y="110" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="7" fill="#6EE7B7">AFGHANISTAN TOURISM &amp; CULTURAL PORTAL</text>
  <text x="70" y="905" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" fill="#FFFFFF">Hamyar Travel</text>
</svg>
