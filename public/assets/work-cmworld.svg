<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg-cmw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180C24"/>
      <stop offset="60%" stop-color="#32164A"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <radialGradient id="glow-cmw" cx="0.75" cy="0.3" r="0.65">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-cmw" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bg-cmw)"/>
  <rect width="1000" height="1000" fill="url(#dots-cmw)"/>
  <rect width="1000" height="1000" fill="url(#glow-cmw)"/>

  <!-- Globe Longitude/Latitude Wireframe -->
  <g stroke="#F472B6" stroke-opacity="0.18" stroke-width="2" fill="none">
    <circle cx="500" cy="460" r="220"/>
    <ellipse cx="500" cy="460" rx="140" ry="220"/>
    <ellipse cx="500" cy="460" rx="70" ry="220"/>
    <line x1="280" y1="460" x2="720" y2="460"/>
    <ellipse cx="500" cy="460" rx="220" ry="110"/>
  </g>

  <!-- Open Book of Education with Wings of Change -->
  <g transform="translate(500, 480)" stroke="#FBCFE8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Page -->
    <path d="M0,40 C-60,0 -160,20 -200,80 L-200,-40 C-160,-100 -60,-120 0,-80 Z" fill="#F472B6" fill-opacity="0.15"/>
    <path d="M-30,-50 C-70,-80 -130,-70 -160,-20" stroke-width="2.5" stroke-opacity="0.6"/>
    <path d="M-30,-20 C-70,-50 -130,-40 -160,10" stroke-width="2.5" stroke-opacity="0.6"/>
    <!-- Right Page -->
    <path d="M0,40 C60,0 160,20 200,80 L200,-40 C160,-100 60,-120 0,-80 Z" fill="#F472B6" fill-opacity="0.15"/>
    <path d="M30,-50 C70,-80 130,-70 160,-20" stroke-width="2.5" stroke-opacity="0.6"/>
    <path d="M30,-20 C70,-50 130,-40 160,10" stroke-width="2.5" stroke-opacity="0.6"/>
    <!-- Spine -->
    <line x1="0" y1="-80" x2="0" y2="60" stroke="#FDE047" stroke-width="6"/>
  </g>

  <!-- Rising Star of Youth Potential -->
  <g transform="translate(500, 270)">
    <circle cx="0" cy="0" r="28" fill="#FDE047" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="14" fill="#FDE047"/>
    <g stroke="#FDE047" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-45" x2="0" y2="-25"/>
      <line x1="0" y1="25" x2="0" y2="45"/>
      <line x1="-45" y1="0" x2="-25" y2="0"/>
      <line x1="25" y1="0" x2="45" y2="0"/>
      <line x1="-30" y1="-30" x2="-18" y2="-18"/>
      <line x1="18" y1="18" x2="30" y2="30"/>
      <line x1="30" y1="-30" x2="18" y2="-18"/>
      <line x1="-18" y1="18" x2="-30" y2="30"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="70" y="110" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="7" fill="#F472B6">YOUTH EMPOWERMENT &amp; EDUCATION NGO</text>
  <text x="70" y="905" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800" fill="#FFFFFF">Change Makers World</text>
</svg>
