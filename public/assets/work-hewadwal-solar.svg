<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg-solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06131D"/>
      <stop offset="60%" stop-color="#0B2538"/>
      <stop offset="100%" stop-color="#134460"/>
    </linearGradient>
    <radialGradient id="glow-solar" cx="0.8" cy="0.2" r="0.65">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-solar" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bg-solar)"/>
  <rect width="1000" height="1000" fill="url(#dots-solar)"/>
  <rect width="1000" height="1000" fill="url(#glow-solar)"/>

  <!-- Radiating Sun Burst in Top Right Corner -->
  <g transform="translate(820, 200)">
    <circle cx="0" cy="0" r="50" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FBBF24" stroke-width="3" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.3"/>
    <!-- Solar Rays pointing down-left -->
    <g stroke="#FCD34D" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6">
      <line x1="-120" y1="20" x2="-220" y2="40"/>
      <line x1="-90" y1="90" x2="-190" y2="170"/>
      <line x1="-20" y1="120" x2="-70" y2="240"/>
      <line x1="-110" y1="-50" x2="-200" y2="-90"/>
    </g>
  </g>

  <!-- High-Tech 3D Perspective Solar Panel Grid -->
  <g transform="translate(160, 360)">
    <!-- Base Panel 1 (Left) -->
    <polygon points="40,240 280,140 460,190 220,320" fill="#0E3854" stroke="#38BDF8" stroke-width="3.5"/>
    <!-- Cell Grid lines on Panel 1 -->
    <line x1="160" y1="190" x2="340" y2="255" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="100" y1="215" x2="280" y2="288" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="220" y1="165" x2="400" y2="222" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="250" y1="150" x2="130" y2="280" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="355" y1="165" x2="235" y2="295" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Base Panel 2 (Right) -->
    <polygon points="260,130 500,40 680,85 440,205" fill="#0C2E46" stroke="#38BDF8" stroke-width="3.5"/>
    <!-- Cell Grid lines on Panel 2 -->
    <line x1="380" y1="85" x2="560" y2="145" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="320" y1="108" x2="500" y2="175" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="440" y1="62" x2="620" y2="115" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="470" y1="50" x2="350" y2="170" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="575" y1="65" x2="455" y2="185" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.7"/>
  </g>

  <!-- Clean Energy Circuit / Battery Flow Indicator -->
  <g stroke="#34D399" stroke-width="4" fill="none" stroke-linecap="round">
    <polyline points="200,690 380,690 440,630 620,630 680,670 820,670"/>
    <circle cx="200" cy="690" r="7" fill="#34D399"/>
    <circle cx="440" cy="630" r="6" fill="#34D399"/>
    <circle cx="680" cy="670" r="6" fill="#34D399"/>
    <circle cx="820" cy="670" r="8" fill="#FBBF24" stroke="#F59E0B" stroke-width="3"/>
  </g>

  <!-- Typography -->
  <text x="70" y="110" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="7" fill="#FCD34D">SOLAR ENERGY SYSTEMS &amp; CLEANTECH</text>
  <text x="70" y="905" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" fill="#FFFFFF">Hewadwal Solar</text>
</svg>
